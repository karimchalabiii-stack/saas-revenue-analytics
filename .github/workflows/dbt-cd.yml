name: dbt CD

on:
  push:
    branches:
      - main

jobs:
  dbt-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core==1.12.4 dbt-bigquery==1.12.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DBT_PROD_KEY }}

      - name: Create dbt PROD profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          saas_revenue_analytics:
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: saas-revenue-analytics-507122
                dataset: dbt_prod_technical
                location: US
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
            target: prod
          EOF

      - name: Deploy dbt to production
        working-directory: dbt/saas_revenue_analytics
        run: dbt build --target prod