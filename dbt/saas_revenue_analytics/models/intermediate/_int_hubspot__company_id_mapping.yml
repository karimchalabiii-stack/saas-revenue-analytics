version: 2

models:
  - name: int_hubspot__company_id_mapping
    description: "Maps each Subskribe account HubSpot company ID to its current canonical HubSpot company ID."

    columns:
      - name: account_id
        description: "Unique identifier of the Subskribe account."
        data_tests:
          - not_null
          - unique

      - name: hubspot_company_id
        description: "HubSpot company identifier referenced by the Subskribe account."

      - name: canonical_company_id
        description: "Current canonical HubSpot company identifier after resolving merged company IDs."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_hubspot__companies')
                field: company_id

      - name: mapping_type
        description: "Method used to resolve the HubSpot company identifier."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - direct
                  - merged
                  - unresolved